name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset=release

      - name: Build
        run: cmake --build build/release --parallel

      - name: Run unit tests
        run: ctest --test-dir build/release --output-on-failure
